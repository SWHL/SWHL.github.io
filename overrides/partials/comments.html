{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <!-- Insert generated snippet here -->
    <script src="https://giscus.app/client.js"
        data-repo="SWHL/SWHL.github.io"
        data-repo-id="R_kgDOGcXK0A"
        data-category="Q&A"
        data-category-id="DIC_kwDOGcXK0M4C0lQp"
        data-mapping="url"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="https://cdn.jsdelivr.net/gh/SWHL/SWHL.github.io@main/docs/stylesheets/giscus-light.css"
        data-lang="zh-CN" data-loading="lazy" crossorigin="anonymous" async>
    </script>

  <!-- Synchronize Giscus theme with palette -->
  <script>
    var giscusThemes = {
      light: "https://cdn.jsdelivr.net/gh/SWHL/SWHL.github.io@main/docs/stylesheets/giscus-light.css",
      dark: "https://cdn.jsdelivr.net/gh/SWHL/SWHL.github.io@main/docs/stylesheets/giscus-dark.css"
    }
    var giscus = document.querySelector("script[src*=giscus]")

    function getGiscusTheme() {
      var palette = __md_get("__palette")
      return palette && typeof palette.color === "object" && palette.color.scheme === "slate"
        ? giscusThemes.dark
        : giscusThemes.light
    }

    // Set palette on initial load
    if (giscus) {
      // Instruct Giscus to set theme
      giscus.setAttribute("data-theme", getGiscusTheme())
    }

    // Register event handlers after documented loaded
    document.addEventListener("DOMContentLoaded", function() {
      var ref = document.querySelector("[data-md-component=palette]")
      if (!ref) return

      ref.addEventListener("change", function() {
        var frame = document.querySelector(".giscus-frame")
        if (frame && frame.contentWindow) {
          // Instruct Giscus to change theme
          frame.contentWindow.postMessage(
            { giscus: { setConfig: { theme: getGiscusTheme() } } },
            "https://giscus.app"
          )
        }
      })
    })
  </script>
{% endif %}
